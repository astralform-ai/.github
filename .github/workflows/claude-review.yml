name: Claude PR Review
# Reusable: auto-review on PR open. Caller wires triggers + permissions.
#
# The reviewer is allowed to RUN the JS gate, not just read the diff. None of
# these repos run tests or type-checks as a PR check, so a review that can only
# read is reviewing claims about the gate rather than the gate. Callers that
# want this must grant `packages: read` alongside the rest — a reusable
# workflow's permissions are intersected with the caller's, so requesting it
# here alone does nothing.
#
# Safe because every calling repo is private with forking disabled: a PR can
# only come from an org member, so running its package.json scripts is the same
# trust level as running them locally. Do not add a public repo as a caller
# without revisiting that.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label or labels (e.g. ubuntu-latest, self-hosted)
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
      # Pull the private @astralform-ai/ui from GitHub Packages — same grant
      # deploy.yml uses. Without it `npm ci` 401s and the gate can't run.
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Written into the workspace rather than ~/.npmrc: the runner may be
      # self-hosted, where $HOME persists between jobs and would accumulate a
      # dead token line per run.
      - name: Authenticate npm for GitHub Packages
        if: hashFiles('**/package.json') != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@astralform-ai:registry=https://npm.pkg.github.com\n' > "$GITHUB_WORKSPACE/.npmrc"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> "$GITHUB_WORKSPACE/.npmrc"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Review this pull request for code quality, bugs, security, and performance.
            The PR branch is checked out in the working directory.

            These repos run no tests or type-checks as a PR check, so the local
            gate is the only gate. Where the repo has a JS one, run it — the
            type-check, lint and test scripts in package.json — and report what
            it actually returned rather than repeating what the PR claims. If
            dependencies will not install, say so plainly and fall back to
            reading the diff; a broken install is a fact about this runner, not
            a finding about the PR.

            Do NOT run the Python suite even where you can see one. Its
            integration tests reach the production database through a tunnel,
            so pytest here would write to prod.

            Use `gh pr comment` for one top-level summary.
            Use mcp__github_inline_comment__create_inline_comment (with confirmed: true)
            for line-specific findings. Do not respond as a chat message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npm:*),Bash(npx:*)"
