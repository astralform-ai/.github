name: Claude PR Review
# Reusable: auto-review on PR. Caller wires triggers + permissions.
#
# This workflow READS A DIFF AND COMMENTS. It does not run the gate — each caller's
# own `ci.yml` does, as a real check with a boolean conclusion. That split is the
# whole point: a gate whose result depends on whether the model chose to run it, and
# on whether the install happened to work that time, is not a gate. It was measured
# failing to install on roughly one review in three, and the reviews that could not
# install still asserted behavioural claims.
#
# Everything the old version carried for that job is deliberately gone:
#   - no setup-node / corepack / npm auth, and callers no longer need `packages: read`
#   - no Bash(npm|npx|pnpm) grants, so no private-registry token in a job whose only
#     purpose is to read a diff
#   - no `gh`. The summary now goes through the action's own tracking comment.
#     `gh` is NOT INSTALLED on the self-hosted runners, so `gh pr comment` silently
#     forced every summary into an inline comment — that is, into a blocking review
#     thread. Verified across Astralform #746–#759: zero top-level comments from this
#     workflow, and four reviews saying so in their own words ("gh: command not found").
#     A clean review therefore still handed the merge gate something to resolve, which
#     is why the loop had no stop condition.
#
# `pull_request`, NOT `pull_request_target`: GitHub withholds secrets from
# fork-originated `pull_request` runs, so a fork PR cannot reach
# CLAUDE_CODE_OAUTH_TOKEN. Public callers must also leave `runner` at its default so
# they get ephemeral hosted runners. Changing either turns this into fork-PR code
# execution — check both before touching the trigger or a caller's runner.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label or labels (e.g. ubuntu-latest, self-hosted)
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          # Was 1. Deep enough to reach the previous head so a re-review can scope
          # to the delta instead of re-reading the whole diff on every push.
          # Whole-diff re-review is why findings-per-push stayed flat across rounds
          # instead of decaying, and why a PR that grows under review never converged.
          fetch-depth: 50

      # Fail loudly if the workspace is not the repo this run is reviewing.
      #
      # A review once posted findings for a DIFFERENT repository's files
      # (astralform-ai/Astralform#688): seven real astralform-chat paths, every line
      # number in range, on an Astralform PR — and the check still went green,
      # because the comments merely failed to anchor. A green check backed by
      # someone else's code is worse than a red one.
      #
      # Self-hosted runners do not clean `_work` between jobs, so a sibling repo's
      # checkout can persist for hours.
      - name: Assert the workspace is this repository
        env:
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          # Exact match on a normalised owner/repo, NOT a substring: this org has
          # names that prefix each other (Astralform vs Astralform-JS-SDK,
          # Astralform-iOS-SDK), so a substring test would pass on precisely the
          # mix-up this step exists to catch.
          origin="$(git remote get-url origin)"
          actual="$(printf '%s' "$origin" \
            | sed -E 's#\.git$##; s#^git@[^:]+:##; s#^https?://[^/]+/##')"
          if [ "$actual" = "$EXPECTED_REPO" ]; then
            echo "workspace OK: $actual"
          else
            echo "::error::Workspace mismatch — this run is reviewing $EXPECTED_REPO but the checkout is $actual ($origin)"
            exit 1
          fi

      # Bubblewrap creates its bind-mount TARGETS before mounting, and Claude Code's
      # sandbox puts two of them directly under /home:
      #
      #   bwrap: Can't create file at /home/.mcp.json: Permission denied
      #   bwrap: Can't mkdir /home/.claude: Permission denied
      #
      # /home is root-owned on both hosted ubuntu and our self-hosted box, so the
      # create fails, the sandbox never initialises, and EVERY Bash command dies
      # before it runs — `echo hello` included. Pre-creating the targets writable is
      # enough: bwrap then mounts over them instead of trying to make them.
      #
      # Deliberately not the alternatives: `sandbox.enabled: false` is ignored on
      # Linux (anthropics/claude-code#35986, closed as not planned), and deleting
      # /usr/bin/bwrap would persist on the self-hosted runner and strip the sandbox
      # from every workload on that host. This keeps the sandbox on.
      - name: Give bubblewrap its bind targets under /home
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          $SUDO mkdir -p /home/.claude || true
          $SUDO touch /home/.mcp.json || true
          $SUDO chmod 0777 /home/.claude /home/.mcp.json || true
          ls -ld /home /home/.claude /home/.mcp.json || true

      - uses: anthropics/claude-code-action@v1
        env:
          # `github.event.before` is the sha this reviewer last saw on a
          # `synchronize`. Empty on `opened`, which is correctly read below as
          # "first review, whole diff".
          PREVIOUS_HEAD: ${{ github.event.before }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Tag mode: the action creates and maintains ONE top-level tracking
          # comment, and the final message lands in it. That is where the verdict
          # goes. Critically, it is a plain issue comment and NOT a review thread,
          # so a clean review no longer leaves the merge gate something to resolve.
          # This replaces `gh pr comment`, which never worked on the self-hosted
          # runners — see the header.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            You are reviewing a pull request. The branch is checked out.

            ## Severity — label every inline finding

            The label is the first thing in the comment body. There are two.

              [BLOCKING] — the change is wrong, and you can name a concrete input
                           that produces a wrong output. Broken behaviour, a guard
                           that does not hold, data loss, a leak, a race, an
                           unhandled error path, a broken contract, a security hole,
                           or a test that passes both with and without the change.

              [NIT]      — everything else. Stale or imprecise comments, docstrings
                           and markdown; naming; wording; readability; "consider
                           extracting"; "you could also handle X"; anything whose
                           fix grows the diff.

            Two rules on that boundary, because they are where this goes wrong:

            - Documentation coherence is ALWAYS [NIT]. A docstring, comment or
              markdown file that contradicts the code is a real defect and is never
              blocking. Provably wrong is what makes it worth reporting — not what
              makes it worth blocking.

            - If you cannot name an input that produces a wrong output, it is [NIT].
              "This could confuse a reader" and "a future maintainer might" are nits.
              Strength of wording is not severity.

            When unsure, label [NIT]. A missed nit costs a line of prose; a
            mislabelled blocker costs a full review round.

            ## Scope

            If PREVIOUS_HEAD is set and non-empty, this is a RE-REVIEW and the new
            work is the delta:

                git log --oneline "$PREVIOUS_HEAD"..HEAD
                git diff "$PREVIOUS_HEAD"..HEAD

            Report on THAT delta. Read wider for context, but do not re-raise a
            finding you have already made — an open thread means the author has not
            replied yet, not that the point needs restating. One exception, and only
            one: if the delta breaks something OUTSIDE it, say so and cite both
            locations.

            Do not report on code this PR does not touch.

            ## Verdict

            End your summary with exactly one of these, on its own line:

                VERDICT: BLOCKING — <n> blocking finding(s)
                VERDICT: CLEAN — no blocking findings

            CLEAN is the expected outcome of a good PR and of most re-reviews. It is
            a complete review, not a failure to find anything. Do not manufacture a
            blocking finding to avoid it, and do not withhold it because nits remain
            — nits are recorded and merged past.

            ## Mechanics

            You are one half of an automated merge loop with a 3-round budget. You
            label; the driver decides. A [BLOCKING] finding costs a full round; a
            [NIT] is recorded and merged past. Report everything you find, label it
            honestly, and do not inflate severity to force attention — nits are read.

            Tests, type-checks and lint run as a SEPARATE CI check on this PR. Do not
            try to run them and do not restate their result as a finding; read the
            check if you need it.

            Your final message becomes the top-level summary comment — do not use
            `gh`, and never post the summary as an inline comment. Use
            mcp__github_inline_comment__create_inline_comment (confirmed: true) for
            line-specific findings, one call per finding.

          # Pin the model. Unset, the action picks its own default, which is not the
          # Opus tier — and nothing in a run surfaces which model reviewed, so the
          # default is invisible until you go looking for it.
          #
          # `claude-opus-5` is the complete id. Do NOT append a date suffix; the
          # dated form is a different string and 404s.
          #
          # The tool list is now just the two things a reviewer needs: the inline
          # comment channel, and enough git to see its own delta. npm/npx/pnpm left
          # with the gate; `gh` was never installed on the self-hosted runners.
          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*)"
