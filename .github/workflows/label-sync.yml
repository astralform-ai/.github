name: Sync labels

on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    # GitHub-hosted, unlike the private repos' label syncs: this repo is public,
    # and the org's self-hosted runner groups do not admit public repositories
    # (so a fork can never reach the production VPS). A self-hosted label here
    # queues until the job expires. Hosted minutes are free for public repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
