name: Sync labels

on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    # Linux: `self-hosted` alone also matches the macOS runners, which are
    # reserved for the jobs that need macOS.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: true
