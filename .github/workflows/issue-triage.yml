name: Issue Triage
# Reusable: silently labels new issues. Caller wires triggers + permissions.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label or labels (e.g. ubuntu-latest, self-hosted)
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  triage:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_non_write_users: "*"
          prompt: |
            Label the new issue using only labels that exist in this repo.

            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Steps:
              1. gh label list --limit 200
              2. gh issue view ${{ github.event.issue.number }} --comments
              3. (Optional) gh search issues "<keywords>" --repo ${{ github.repository }} --limit 10 --state open
              4. Pick at most 5 labels from the fetched vocabulary. Do NOT invent labels.
              5. gh issue edit ${{ github.event.issue.number }} --add-label "<l1>" --add-label "<l2>"

            Rules:
              - DO NOT post comments on the issue.
              - DO NOT use any label not present in `gh label list` output.
              - If nothing applies cleanly, apply nothing.
              - The four `gh` commands above are the ONLY tools you have. Reading
                files, searching the repo, writing todos and every other command
                are denied — each attempt costs a turn and buys nothing. This is a
                labelling job, not an investigation: do not open the codebase, and
                ignore any repo convention that asks you to verify, test or build.
          # 8 was too tight and every run died on it. The floor is 4 calls
          # (labels, issue, optional search, edit) with no room for a retry, and
          # the agent runs on the full claude_code system prompt with
          # settingSources including `project` — so in a repo with a CLAUDE.md it
          # reaches for tools this allowlist forbids. Those denials are charged as
          # turns: recent runs burned 1, 5 and 6 of 8 before doing any work. The
          # prompt now says the toolset is closed; this leaves headroom for when
          # it asks anyway.
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(gh label list:*),Bash(gh issue view:*),Bash(gh search issues:*),Bash(gh issue edit:*)"

      # TEMPORARY diagnostic — remove once triage is labelling again.
      #
      # #4 raised the turn ceiling and the job went from `failure` to `success`,
      # but it still applies no labels: a test issue produced 11 turns, 3
      # permission denials and zero labels, where the same workflow labelled
      # correctly in May. Green-and-does-nothing is worse than red, and the
      # cause cannot be found from the log — it carries the prompt but not the
      # tool calls, and not WHICH tools were denied. Two rounds of diagnosis
      # were spent reading the prompt's own step-5 example text echoed back and
      # mistaking it for invocations.
      #
      # The action already writes all of it to execution_file and then throws it
      # away with the runner. This prints it.
      - name: Print the execution log
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file at '${EXECUTION_FILE:-<unset>}'"
            exit 0
          fi
          echo "--- denials and tool calls ---"
          jq -r '
            (.. | objects | select(has("permission_denials")) | .permission_denials[]?
              | "DENIED: \(.tool_name) \(.tool_input // {} | tostring | .[0:200])"),
            (.. | objects | select(.type? == "tool_use")
              | "CALL:   \(.name) \(.input // {} | tostring | .[0:200])")
          ' "$EXECUTION_FILE" 2>/dev/null || echo "(jq could not parse it)"
          echo "--- raw ---"
          cat "$EXECUTION_FILE"
