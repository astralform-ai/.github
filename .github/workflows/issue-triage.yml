name: Issue Triage
# Reusable: silently labels new issues. Caller wires triggers + permissions.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label or labels (e.g. ubuntu-latest, self-hosted)
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  triage:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Bubblewrap creates its bind-mount TARGETS before mounting, and Claude Code's
      # sandbox puts two of them directly under /home:
      #
      #   bwrap: Can't create file at /home/.mcp.json: Permission denied
      #   bwrap: Can't mkdir /home/.claude: Permission denied
      #
      # /home is root-owned on both GitHub-hosted ubuntu and our self-hosted box, so
      # the create fails, the sandbox never initialises, and EVERY Bash command dies
      # before it runs — `echo hello` included. Pre-creating the targets writable is
      # enough: bwrap then mounts over them instead of trying to make them.
      #
      # Deliberately not the alternatives: `sandbox.enabled: false` is ignored on
      # Linux (anthropics/claude-code#35986, closed as not planned — measured
      # ignored here too, 17 bwrap lines with it set), and deleting /usr/bin/bwrap
      # would persist on the self-hosted runner and strip the sandbox from every
      # workload on that host. This keeps the sandbox on.
      - name: Give bubblewrap its bind targets under /home
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          $SUDO mkdir -p /home/.claude || true
          $SUDO touch /home/.mcp.json || true
          $SUDO chmod 0777 /home/.claude /home/.mcp.json || true
          ls -ld /home /home/.claude /home/.mcp.json || true

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_non_write_users: "*"
          prompt: |
            Label the new issue using only labels that exist in this repo.

            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Steps:
              1. gh label list --limit 200
              2. gh issue view ${{ github.event.issue.number }} --comments
              3. (Optional) gh search issues "<keywords>" --repo ${{ github.repository }} --limit 10 --state open
              4. Pick at most 5 labels from the fetched vocabulary. Do NOT invent labels.
              5. gh issue edit ${{ github.event.issue.number }} --add-label "<l1>" --add-label "<l2>"

            Rules:
              - DO NOT post comments on the issue.
              - DO NOT use any label not present in `gh label list` output.
              - If nothing applies cleanly, apply nothing.
              - The four `gh` commands above are the ONLY tools you have. Reading
                files, searching the repo, writing todos and every other command
                are denied — each attempt costs a turn and buys nothing. This is a
                labelling job, not an investigation: do not open the codebase, and
                ignore any repo convention that asks you to verify, test or build.
          # 8 was too tight and every run died on it. The floor is 4 calls
          # (labels, issue, optional search, edit) with no room for a retry, and
          # the agent runs on the full claude_code system prompt with
          # settingSources including `project` — so in a repo with a CLAUDE.md it
          # reaches for tools this allowlist forbids. Those denials are charged as
          # turns: recent runs burned 1, 5 and 6 of 8 before doing any work. The
          # prompt now says the toolset is closed; this leaves headroom for when
          # it asks anyway.
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(gh label list:*),Bash(gh issue view:*),Bash(gh search issues:*),Bash(gh issue edit:*)"
